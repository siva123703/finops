<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinOps Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; }
        #chat { border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; min-height: 360px; max-height: 500px; overflow-y: auto; background: #fafafa; }
        .msg { margin: 10px 0; padding: 10px 12px; border-radius: 8px; max-width: 85%; }
        .user { background: #2563eb; color: white; margin-left: auto; }
        .bot { background: #e5e7eb; color: #111827; }
        .input-row { display: flex; gap: 10px; margin-top: 14px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #d1d5db; }
        button { padding: 12px 16px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        pre { white-space: pre-wrap; word-wrap: break-word; background: #111827; color: #f9fafb; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FinOps Chatbot</h1>
        <div id="chat"></div>
        <div class="input-row">
            <input id="message" type="text" placeholder="Ask for VM details or FinOps recommendations" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('message');
            const chat = document.getElementById('chat');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('You', text, 'user');
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                appendMessage('Bot', formatResponse(data), 'bot');
            } catch (err) {
                appendMessage('Bot', 'Sorry, something went wrong.', 'bot');
            }
        }

        function formatResponse(data) {
            if (typeof data === 'string') return data;
            return JSON.stringify(data, null, 2);
        }

        function appendMessage(sender, content, type) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerHTML = `<strong>${sender}</strong><br><pre>${escapeHtml(content)}</pre>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        document.getElementById('message').addEventListener('keydown', function (event) {
            if (event.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
